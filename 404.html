<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 – Seite nicht gefunden</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    /* --- exakt die gleichen Styles wie deine Seite --- */
    :root{
      --bg:#071026;
      --card: rgba(255,255,255,0.04);
      --glass: rgba(255,255,255,0.03);
      --accent1: #6ee7b7;
      --accent2: #60a5fa;
      --accent3: #c084fc;
      --rounded: 16px;
      --maxw:1100px;
      --hover-duration: 320ms;
      --hover-ease: cubic-bezier(.2,.9,.2,1);
      --glow: rgba(96,165,250,0.12);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color-scheme: dark;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#071022);color:#e6eef8}

    a{color:inherit;text-decoration:none;position:relative;display:inline-block}
    a::after{content:"";position:absolute;left:0;bottom:-4px;height:3px;width:0;border-radius:4px;background:linear-gradient(90deg,var(--accent1),var(--accent2),var(--accent3));transition:width var(--hover-duration) var(--hover-ease);opacity:0.95}
    a:hover::after{width:100%}

    header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);backdrop-filter: blur(8px);border-bottom:1px solid rgba(255,255,255,0.03)}
    .container{max-width:var(--maxw);margin:0 auto;padding:24px}
    .nav{display:flex;align-items:center;gap:14px}

    .logo{display:flex;align-items:center;gap:12px;cursor:pointer}
    .mark{display:grid;place-items:center;animation:float 1.2s ease-in-out infinite;position:relative;transition:transform var(--hover-duration) var(--hover-ease),filter var(--hover-duration) var(--hover-ease)}
    .mark img{object-fit:contain;display:block;transition:transform var(--hover-duration) var(--hover-ease),filter var(--hover-duration) var(--hover-ease)}

    @keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-8px)}100%{transform:translateY(0)}}

    footer{padding:24px 0;margin-top:40px;border-top:1px solid rgba(255,255,255,0.03)}
    footer .foot-inner{max-width:var(--maxw);margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 24px}
    footer a{padding:6px 4px}
    footer a:hover{transform:translateY(-4px)}

    .center-box{
      min-height:70vh;
      display:grid;
      place-items:center;
      padding:40px 20px;
    }
    .error-card{
      background:var(--card);
      padding:40px;
      border-radius:20px;
      box-shadow:0 18px 60px rgba(2,6,23,0.6);
      backdrop-filter: blur(10px);
      text-align:center;
      max-width:700px;
      width:100%;
      animation:float 4s ease-in-out infinite;
    }
    .error-card h1{
      font-size:64px;
      margin:0 0 20px;
      background:linear-gradient(90deg,var(--accent1),var(--accent2),var(--accent3));
      -webkit-background-clip:text;
      color:transparent;
    }
    .error-card p{font-size:18px;opacity:0.9;margin-bottom:20px}
    .btn{
      padding:14px 20px;
      border-radius:999px;
      background:linear-gradient(90deg,var(--accent1),var(--accent2));
      border:0;
      cursor:pointer;
      font-weight:700;
      color:#061126;
      text-decoration:none;
      display:inline-block;
      transition:transform 250ms var(--hover-ease),box-shadow 250ms var(--hover-ease)
    }
    .btn:hover{
      transform:translateY(-6px) scale(1.02);
      box-shadow:0 20px 60px rgba(96,165,250,0.12);
    }
  </style>
</head>

<body>

<header>
  <div class="container nav">
    <a href="/" class="logo">
      <div class="mark">
        <img src="header_logo.png" alt="Schultimer Logo" width="44" height="44">
      </div>
      <div>
        <h1 style="font-size:18px;margin:0">Schultimer 2</h1>
        <p style="margin:0;font-size:12px;opacity:0.85">Von Schüler - Für Schüler</p>
      </div>
    </a>

    <div style="margin-left:auto" class="muted">
      Hinweis: Die Website steht in keinem Bezug zu einer Schule!
    </div>
  </div>
</header>

<main>
  <div class="center-box">
    <div class="error-card">
      <h1>404</h1>
      <p>Oops! Die von dir gesuchte Seite existiert nicht.</p>
      <a class="btn" href="/">Zur Startseite</a>
    </div>
  </div>
</main>

<footer>
  <div class="foot-inner">
    <div class="muted">Schultimer 2 — © 2025 Kilian Reg</div>
    <div style="display:flex;gap:12px;align-items:center">
      <a href="/lernen.html">Lernbereich (NEU!)</a>
      <a href="/impressum.html">Impressum</a>
      <a href="/datenschutz.html">Datenschutz</a>
    </div>
  </div>
</footer>

</body>
</html>
