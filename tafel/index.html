<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9AM Hausaufgaben</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2c2c54);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #content {
      text-align: center;
      width: 90%;
      max-width: 400px;
      padding: 20px;
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #00c3ff;
      color: white;
      font-size: 16px;
      margin-top: 15px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: #0099cc;
    }

    .title {
      font-size: 22px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 10px;
    }

    .image-box {
      width: 100%;
      height: 350px;
      background: linear-gradient(135deg, #000, #222);
      border-radius: 15px;
      overflow: hidden;
      margin-top: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #refreshBtn {
      margin-top: 20px;
      background: #00ff99;
    }

    #refreshBtn:hover {
      background: #00cc77;
    }
  </style>
</head>

<body>

  <div id="content">
    <div class="title">📸 Heutige Hausaufgaben</div>
    <div class="subtitle">Stand der Tafel</div>

    <div class="image-box">
      <img id="hausbild" src="hausaufgaben.jpeg" alt="Hausaufgaben Tafel">
    </div>

    <button id="refreshBtn" onclick="refreshImage()">🔄 Aktualisieren</button>
  </div>

  <script>
    function refreshImage() {
      const img = document.getElementById("hausbild");
      img.src = "hausaufgaben.jpeg?timestamp=" + new Date().getTime();
    }
  </script>

</body>
</html>
