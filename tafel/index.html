<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9AM Hausaufgaben</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2c2c54);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #content {
      text-align: center;
      width: 90%;
      max-width: 400px;
      padding: 20px;
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #00c3ff;
      color: white;
      font-size: 16px;
      margin-top: 15px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: #0099cc;
    }

    .title {
      font-size: 22px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .info {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 10px;
    }

    .image-box {
      width: 100%;
      height: 350px;
      background: linear-gradient(135deg, #000, #222);
      border-radius: 15px;
      overflow: hidden;
      margin-top: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    #fullscreen img {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
    }

    #closeBtn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
    }

    #closeBtn:hover {
      background: rgba(255,255,255,0.4);
    }

    #refreshBtn {
      margin-top: 20px;
      background: #00ff99;
    }

    #refreshBtn:hover {
      background: #00cc77;
    }

    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 255, 150, 0.9);
      color: black;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      display: none;
      z-index: 1000;
    }
  </style>
</head>

<body>

  <div id="content">
    <div class="title">📸 Heutige Hausaufgabentafel</div>
    <div class="info">Wird täglich ca. 13 Uhr aktualisiert</div>
    <div class="subtitle">Stand: 25.03.26</div>

    <div class="image-box" onclick="openFullscreen()">
      <img id="hausbild" alt="Hausaufgaben Tafel">
    </div>

    <button id="refreshBtn" onclick="refreshImage()">🔄 Aktualisieren</button>
  </div>

  <div id="fullscreen">
    <div id="closeBtn" onclick="closeFullscreen()">X</div>
    <img id="fullimg">
  </div>

  <div id="toast">✅ Aktualisiert!</div>

  <script>
    const imageFile = "hausaufgaben.jpeg";

    const img = document.getElementById("hausbild");
    const fullimg = document.getElementById("fullimg");

    function loadImage() {
      const src = imageFile + "?t=" + new Date().getTime();
      img.src = src;
      fullimg.src = src;
    }

    function refreshImage() {
      loadImage();

      const toast = document.getElementById("toast");
      toast.style.display = "block";

      setTimeout(() => {
        toast.style.display = "none";
      }, 1500);
    }

    function openFullscreen() {
      document.getElementById("fullscreen").style.display = "flex";
    }

    function closeFullscreen() {
      document.getElementById("fullscreen").style.display = "none";
    }

    loadImage();
  </script>

</body>
</html>
